name: Build

on:
  push: ~
  pull_request: ~
  release:
    types: [created]
  schedule:
    -
      cron: "0 1 * * 6" # Run at 1am every Saturday

jobs:
  tests:
    runs-on: ubuntu-latest

    name: "PHP ${{ matrix.php }}, ECS ${{ matrix.ecs }}"

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            ecs: '10.*'
            slevomat: '8.15.0'
          - php: '8.0'
            ecs: '11.*'
            slevomat: '8.15.0'
          - php: '8.0'
            ecs: '12.*'
            slevomat: '8.16.0'
          - php: '8.0'
            ecs: '13.*'
            slevomat: '8.16.0'

    steps:
      -
        uses: actions/checkout@v3

      -
        name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: intl
          tools: symfony
          coverage: none

      -
        name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      -
        name: Cache Composer
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json **/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      -
        name: Configure Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins "symfony/flex:^1.10"

      -
        name: Require EasyCodingStandard version
        run: composer require symplify/easy-coding-standard:${{ matrix.ecs }} --no-update --no-scripts

      -
        name: Require Slevomat version for ECS leg
        run: composer require slevomat/coding-standard:${{ matrix.slevomat }} --no-update --no-scripts

      -
        name: Install PHP dependencies
        run: composer install --no-interaction

      -
        name: Validate composer.json
        run: composer validate --ansi --strict

      -
        name: Run test
        run: |
            PATHS=(
              ecs.php
              tests/Sample.php
              tests/SampleSpec.php
              tests/FooBar.php
              tests/BehatContext.php
              tests/Generics.php
              tests/Annotations.php
            )
            while IFS= read -r file; do
              PATHS+=("$file")
            done < <(find tests -maxdepth 1 -name '*Test.php')
            vendor/bin/ecs check --config ecs.php "${PATHS[@]}"

      -
        name: Run PHPUnit (default order)
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --colors=never

      -
        name: Run PHPUnit (random order, seed 20261008)
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --order-by=random --random-order-seed=20261008 --colors=never

      -
        name: "Check exported files"
        run: |
            EXPECTED="CONFLICTS.md,LICENSE,README.md,composer.json,ecs.php"
            CURRENT="$(
                git archive HEAD \
                    | tar --list \
                    | paste --serial --delimiters=","
            )"
            echo "CURRENT =${CURRENT}"
            echo "EXPECTED=${EXPECTED}"
            test "${CURRENT}" = "${EXPECTED}"
